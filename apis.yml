aid: fortive
name: Fortive
description: >-
  Fortive Corporation is a Fortune 500 diversified industrial technology
  conglomerate headquartered in Everett, Washington. The company operates
  across two main segments, Advanced Healthcare Solutions and Intelligent
  Operating Solutions, providing essential technologies for medical device
  safety, radiation protection, workflow automation, hazard detection, and
  predictive maintenance through its operating companies. This repository
  captures any APIs, developer tools, and machine-readable API artifacts
  associated with Fortive at the parent company level. Most APIs and
  developer resources are maintained by Fortive's individual operating
  companies.
